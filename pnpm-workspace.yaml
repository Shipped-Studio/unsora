packages:
  - apps/*
  - packages/*

# The apps were installed with npm's legacy-peer-deps before the move to pnpm.
strictPeerDependencies: false

# Dependency install scripts that the apps rely on (pnpm blocks them by default).
onlyBuiltDependencies:
  - '@depot/cli' # trigger.dev deploy builder
  - '@prisma/client'
  - '@prisma/engines'
  - esbuild
  - prisma
  - puppeteer # downloads Chrome for scraping
  - sharp
  - unrs-resolver # eslint import resolver

# Install scripts that only print notices or do nothing.
ignoredBuiltDependencies:
  - '@clerk/shared'
  - '@google/genai'
  - core-js
  - msw
  - protobufjs

overrides:
  # fetch-node imports undici 6, 7 and 8 at load time; undici 8 needs Node 22+
  # and crashes on Node 20. npm resolved this alias to undici 7, so keep that
  # until we move to Node 22.
  '@atproto-labs/fetch-node>undici_v8': npm:undici@^7.28.0
