name: CI

on:
  pull_request:
  push:
    branches: [main, v3]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # turbo --affected compares against the base branch
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Type-check every affected app, and build the server-side apps.
      # The client build needs real Clerk/Stripe env, so it's type-checked only.
      - run: pnpm turbo run typecheck --affected
      - run: pnpm turbo run build --affected --filter=@unsora/server --filter=@unsora/mcp
