<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Unsora Voices</title>
<!--
  Unsora voice picker (MCP Apps, `text/html;profile=mcp-app`).

  Flow: the host sends list_voiceover_voices' result -> we show every voice as
  a chip; tapping one plays its preview clip and shows its details; "Use"
  posts the choice into the chat so the model calls create_voiceover. If the
  host reopens the widget without replaying the result, we fetch the list.

  Also bound to list_voices (sections: the user's clones, Eleven v3 voices,
  MiniMax presets) and to create_voice_clone / delete_voice_clone, after which
  we reload list_voices. Clones can be deleted from here.

  No framework or SDK: a small JSON-RPC bridge over postMessage covers the
  spec methods used here (ui/initialize, tools/call, ui/message,
  ui/notifications/size-changed).
-->
<style>
  :root {
    color-scheme: light dark;
    --bg: var(--color-background-primary, #ffffff);
    --card: var(--color-background-secondary, #f7f7f7);
    --chip: var(--color-background-tertiary, #eeeeee);
    --text: var(--color-text-primary, #111111);
    --muted: var(--color-text-secondary, #6b6b6b);
    --border: var(--color-border-primary, rgba(0, 0, 0, 0.1));
    --danger: var(--color-text-danger, #c0392b);
    --primary: var(--color-text-primary, #111111);
    --on-primary: var(--color-background-primary, #ffffff);
    --radius: var(--border-radius-lg, 14px);
    --radius-sm: var(--border-radius-md, 9px);
    --font: var(--font-sans, ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif);
  }
  :root[data-theme="dark"] {
    --bg: var(--color-background-primary, #1a1a1a);
    --card: var(--color-background-secondary, #222222);
    --chip: var(--color-background-tertiary, #2c2c2c);
    --text: var(--color-text-primary, #f2f2f2);
    --muted: var(--color-text-secondary, #a0a0a0);
    --border: var(--color-border-primary, rgba(255, 255, 255, 0.12));
    --danger: var(--color-text-danger, #ff7a6b);
    --primary: var(--color-text-primary, #f2f2f2);
    --on-primary: var(--color-background-primary, #1a1a1a);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; overflow: hidden; background: transparent; }
  body { font: 14px/1.4 var(--font); color: var(--text); }
  #root { padding: 2px; }

  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 12px;
  }
  .pending { display: flex; align-items: center; gap: 10px; padding: 12px 14px; }
  .spinner {
    width: 16px; height: 16px; flex: none;
    border: 2px solid var(--border); border-top-color: var(--text);
    border-radius: 50%; animation: spin 0.9s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  @media (prefers-reduced-motion: reduce) { .spinner { animation-duration: 3s; } }
  .pending strong { font-weight: 600; }
  .muted { color: var(--muted); font-size: 13px; }
  .error { color: var(--danger); font-size: 13px; }

  .chips { display: flex; flex-wrap: wrap; gap: 8px; }
  .chip {
    display: inline-flex; align-items: center; gap: 8px;
    padding: 5px 12px 5px 5px; border-radius: 999px; border: 1px solid transparent;
    background: var(--chip); color: var(--text);
  }
  .chip.selected { border-color: var(--text); }
  .chip.unavailable { opacity: 0.6; }
  .orb { width: 26px; height: 26px; flex: none; border-radius: 50%; }
  .chip.playing .orb { box-shadow: 0 0 0 2px var(--card), 0 0 0 4px var(--text); }
  /* Play / pause glyphs drawn in CSS. */
  .state { width: 10px; height: 10px; flex: none; position: relative; color: var(--muted); }
  .state.play { border-style: solid; border-width: 5px 0 5px 9px; border-color: transparent transparent transparent currentColor; width: 0; height: 0; }
  .state.pause::before, .state.pause::after { content: ""; position: absolute; top: 0; width: 3px; height: 10px; background: currentColor; }
  .state.pause::before { left: 1px; } .state.pause::after { right: 1px; }
  .chip.playing .state { color: var(--text); }

  .details { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-top: 12px; min-height: 32px; }
  .details .about { flex: 1 1 220px; font-size: 13px; color: var(--muted); }
  .details .about strong { color: var(--text); }
  .badge {
    font-size: 12px; font-weight: 600; color: var(--muted); text-transform: capitalize;
    padding: 2px 8px; border-radius: 999px; background: var(--chip);
  }

  button {
    font: inherit; font-size: 13px; font-weight: 600; cursor: pointer;
    padding: 7px 14px; border-radius: var(--radius-sm);
    border: 1px solid var(--border); background: var(--bg); color: var(--text);
  }
  button:hover:not(:disabled) { filter: brightness(0.96); }
  button:disabled { opacity: 0.5; cursor: default; }
  button.primary { background: var(--primary); color: var(--on-primary); border-color: transparent; }
  button.chip { font-size: 13px; }
  button.danger { color: var(--danger); }
  button.primary.danger { background: var(--danger); color: #fff; }
  .group + .group { margin-top: 12px; }
  .group-title { font-size: 12px; font-weight: 700; color: var(--muted); margin-bottom: 6px; }
  .notice { font-size: 13px; color: var(--muted); margin-bottom: 10px; }
</style>
</head>
<body>
<div id="root"></div>
<script>
(() => {
  "use strict";

  const LIST_TOOL = "list_voiceover_voices";
  const ALL_VOICES_TOOL = "list_voices";
  const FALLBACK_FETCH_MS = 1500;

  /* ------------------------------ bridge ------------------------------ */

  let nextId = 1;
  const pending = new Map();

  function post(msg) { window.parent.postMessage({ jsonrpc: "2.0", ...msg }, "*"); }

  function request(method, params) {
    const id = nextId++;
    post({ id, method, params });
    return new Promise((resolve, reject) => pending.set(id, { resolve, reject }));
  }

  function notify(method, params) { post({ method, params }); }

  window.addEventListener("message", (event) => {
    if (event.source !== window.parent) return;
    const msg = event.data;
    if (!msg || msg.jsonrpc !== "2.0") return;

    // Response to one of our requests.
    if (msg.id != null && !msg.method) {
      const p = pending.get(msg.id);
      if (!p) return;
      pending.delete(msg.id);
      msg.error ? p.reject(new Error(msg.error.message || "Request failed")) : p.resolve(msg.result);
      return;
    }
    // Request from the host.
    if (msg.id != null && msg.method) {
      if (msg.method === "ui/resource-teardown" || msg.method === "ping") {
        if (msg.method === "ui/resource-teardown") stop();
        post({ id: msg.id, result: {} });
      } else {
        post({ id: msg.id, error: { code: -32601, message: "Method not found" } });
      }
      return;
    }
    // Notifications.
    const params = msg.params || {};
    switch (msg.method) {
      case "ui/notifications/tool-result":
        onToolResult(params);
        break;
      case "ui/notifications/tool-cancelled":
        if (!voices.length) { error = "Cancelled."; render(); }
        break;
      case "ui/notifications/host-context-changed":
        applyHostContext(params);
        break;
    }
  });

  function applyHostContext(ctx) {
    if (!ctx) return;
    const root = document.documentElement;
    if (ctx.theme) root.dataset.theme = ctx.theme;
    const vars = ctx.styles && ctx.styles.variables;
    if (vars) for (const [k, v] of Object.entries(vars)) if (v) root.style.setProperty(k, v);
  }

  // Report our height so the host sizes the frame exactly (no inner scroll).
  let lastHeight = 0;
  new ResizeObserver(() => {
    const height = Math.ceil(document.documentElement.getBoundingClientRect().height);
    if (height !== lastHeight) {
      lastHeight = height;
      notify("ui/notifications/size-changed", { height });
    }
  }).observe(document.documentElement);

  /* ------------------------------- state ------------------------------ */

  let voices = []; // [{ id, label, description, gender, accent, previewUrl, group }]
  let library = null; // list_voices extras: { maxClones, cloneCreditCost }
  let notice = null;
  let confirmDelete = null; // clone id awaiting confirmation
  let busy = false;
  let selected = null;
  let playingId = null;
  let error = null;
  const broken = new Set(); // voice ids whose preview failed to play
  const flash = {}; // button key -> temporary label
  let audio = null;

  function parseVoices(sc) {
    const list = sc && Array.isArray(sc.voices) ? sc.voices : [];
    return list
      .filter((v) => v && typeof v.id === "string")
      .map((v) => ({
        id: v.id,
        label: typeof v.label === "string" ? v.label : v.id,
        description: typeof v.description === "string" ? v.description : "",
        gender: typeof v.gender === "string" ? v.gender : "",
        accent: typeof v.accent === "string" ? v.accent : "",
        previewUrl: typeof v.previewUrl === "string" ? v.previewUrl : null,
      }));
  }

  /** list_voices: { presets, elevenV3Voices, clones, maxClones, cloneCreditCost }. */
  function parseLibrary(sc) {
    if (!sc || !(Array.isArray(sc.elevenV3Voices) || Array.isArray(sc.clones) || Array.isArray(sc.presets))) return null;
    const clones = (sc.clones || []).filter((c) => c && typeof c.id === "string").map((c) => ({
      id: c.id,
      label: typeof c.name === "string" ? c.name : "Cloned voice",
      description: typeof c.description === "string" ? c.description : "Your cloned voice",
      gender: "", accent: "",
      previewUrl: c.sampleAsset && typeof c.sampleAsset.url === "string" ? c.sampleAsset.url : null,
      group: "clone",
    }));
    const eleven = parseVoices({ voices: sc.elevenV3Voices || [] }).map((v) => Object.assign(v, { group: "eleven" }));
    const presets = (sc.presets || []).filter((p) => p && typeof p.id === "string").map((p) => ({
      id: p.id, label: typeof p.label === "string" ? p.label : p.id, description: "MiniMax preset voice",
      gender: "", accent: "", previewUrl: null, group: "preset",
    }));
    library = { maxClones: typeof sc.maxClones === "number" ? sc.maxClones : null, cloneCreditCost: sc.cloneCreditCost };
    return clones.concat(eleven, presets);
  }

  async function reloadLibrary(selectId) {
    try {
      const res = await request("tools/call", { name: ALL_VOICES_TOOL, arguments: {} });
      const parsed = parseLibrary(res && res.structuredContent);
      if (parsed) {
        voices = parsed;
        if (selectId) selected = voices.find((v) => v.id === selectId) || null;
      }
    } catch (err) {
      error = "Couldn't load the voices.";
    }
    render();
  }

  function onToolResult(result) {
    const sc = result && result.structuredContent;
    // create_voice_clone: { success, clone, creditsDeducted }; delete: { success, message }.
    if (sc && sc.clone && typeof sc.clone.id === "string") {
      notice = "Voice cloned" + (typeof sc.creditsDeducted === "number" ? " · " + sc.creditsDeducted + " credits used" : "") + ".";
      reloadLibrary(sc.clone.id);
      return;
    }
    if (sc && sc.success && !sc.voices && !sc.clones && /delet/i.test(String(sc.message || ""))) {
      notice = "Cloned voice deleted.";
      reloadLibrary();
      return;
    }
    const fromLibrary = parseLibrary(sc);
    if (fromLibrary) {
      voices = fromLibrary;
      error = null;
      render();
      return;
    }
    const parsed = parseVoices(result && result.structuredContent);
    if (parsed.length) {
      voices = parsed;
      error = null;
    } else if (result && result.isError && !voices.length) {
      error = "Couldn't load the voices.";
    }
    render();
  }

  /** The host may reopen the widget without replaying the result: fetch it. */
  async function fetchVoices() {
    if (voices.length) return;
    try {
      const res = await request("tools/call", { name: LIST_TOOL, arguments: {} });
      onToolResult(res);
    } catch (err) {
      if (!voices.length) { error = "Couldn't load the voices."; render(); }
    }
  }

  /* ------------------------------ actions ----------------------------- */

  function stop() {
    if (audio) audio.pause();
    playingId = null;
  }

  function toggle(voice) {
    selected = voice;
    if (playingId === voice.id) {
      stop();
      render();
      return;
    }
    stop();
    if (voice.previewUrl && !broken.has(voice.id)) {
      if (!audio) {
        audio = new Audio();
        audio.addEventListener("ended", () => { playingId = null; render(); });
      }
      const fail = () => { broken.add(voice.id); if (playingId === voice.id) playingId = null; render(); };
      audio.onerror = fail;
      audio.src = voice.previewUrl;
      audio.play().catch(fail);
      playingId = voice.id;
    }
    render();
  }

  /** Post the choice into the chat; the model drives create_voiceover. */
  async function useVoice(voice) {
    const key = "use:" + voice.id;
    try {
      const res = await request("ui/message", {
        role: "user",
        content: [{
          type: "text",
          text:
            'I picked the "' + voice.id + '" voice. Ask me for the script if you don\'t already ' +
            'have it, then call create_voiceover with voice_id "' + voice.id + '".',
        }],
      });
      showFlash(key, res && res.isError ? "Couldn't send" : "Sent");
    } catch (err) {
      showFlash(key, "Couldn't send");
    }
  }

  async function deleteClone(voice) {
    busy = true;
    render();
    try {
      const res = await request("tools/call", { name: "delete_voice_clone", arguments: { cloneId: voice.id } });
      if (res && res.isError) throw new Error("Couldn't delete the voice.");
      confirmDelete = null;
      selected = null;
      notice = "Deleted " + voice.label + ".";
      await reloadLibrary();
    } catch (err) {
      notice = err.message || "Couldn't delete the voice.";
    }
    busy = false;
    render();
  }

  function showFlash(key, label) {
    flash[key] = label;
    render();
    setTimeout(() => { delete flash[key]; render(); }, 2000);
  }

  /* ------------------------------ render ------------------------------ */

  const root = document.getElementById("root");

  function el(tag, attrs, children) {
    const node = document.createElement(tag);
    for (const [k, v] of Object.entries(attrs || {})) {
      if (k === "onclick") node.addEventListener("click", v);
      else if (k === "class") node.className = v;
      else if (v === true) node.setAttribute(k, "");
      else if (v !== false && v != null) node.setAttribute(k, v);
    }
    for (const child of [].concat(children || [])) {
      if (child != null) node.append(child);
    }
    return node;
  }

  /** Orb gradient per voice; unknown voices get a stable hue from their id. */
  const ORBS = {
    Aria: ["#f0a6b8", "#c2426e"], Roger: ["#7ba7d9", "#2f4f80"], Sarah: ["#ffd9a8", "#e08a3c"],
    Laura: ["#fff3a8", "#f0b83c"], Charlie: ["#a8e8c8", "#2f9e6e"], George: ["#d9c2a8", "#8a6242"],
    Callum: ["#c2c2cc", "#5a5a6e"], River: ["#a8e0e8", "#3c8a9e"], Liam: ["#ffc2a8", "#e0662f"],
    Charlotte: ["#e0b8f0", "#8a3cb8"], Alice: ["#b8d9ff", "#4272c2"], Matilda: ["#ffb8d9", "#d94f8a"],
    Will: ["#c2f0d9", "#42a880"], Jessica: ["#ffb8c2", "#f0426e"], Eric: ["#d9d9a8", "#9e9e3c"],
    Chris: ["#e8d0b8", "#b8804f"], Brian: ["#b8c2f0", "#4f5ac2"], Daniel: ["#c2d9e8", "#42708a"],
    Lily: ["#f0d0e8", "#b8529e"], Bill: ["#d0e8b8", "#6e9e42"],
  };

  function orb(id) {
    let colors = ORBS[id];
    if (!colors) {
      let hash = 0;
      for (let i = 0; i < id.length; i++) hash = (hash * 31 + id.charCodeAt(i)) | 0;
      const hue = ((hash % 360) + 360) % 360;
      colors = ["hsl(" + hue + " 70% 78%)", "hsl(" + hue + " 55% 42%)"];
    }
    return "background: radial-gradient(circle at 32% 28%, " + colors[0] + ", " + colors[1] + " 78%)";
  }

  function chip(voice) {
    const noPreview = !voice.previewUrl || broken.has(voice.id);
    // Presets never have previews; that's not an error worth greying out.
    const unavailable = noPreview && voice.group !== "preset";
    const playing = playingId === voice.id;
    const classes = ["chip"];
    if (playing) classes.push("playing");
    if (selected && selected.id === voice.id) classes.push("selected");
    if (unavailable) classes.push("unavailable");
    return el("button", {
      type: "button",
      class: classes.join(" "),
      title: voice.description + (unavailable ? " (preview unavailable)" : ""),
      "aria-pressed": playing ? "true" : "false",
      onclick: () => toggle(voice),
    }, [
      el("span", { class: "orb", style: orb(voice.id), "aria-hidden": "true" }),
      el("span", null, voice.label),
      noPreview ? null : el("span", { class: "state " + (playing ? "pause" : "play"), "aria-hidden": "true" }),
    ]);
  }

  function details() {
    if (!selected) return el("div", { class: "details" }, el("span", { class: "muted" }, "Tap a voice to hear a preview."));
    const key = "use:" + selected.id;
    const voice = selected;
    if (confirmDelete === voice.id) {
      return el("div", { class: "details" }, [
        el("span", { class: "about" }, ["Delete ", el("strong", null, voice.label), " permanently? This can't be undone."]),
        el("button", { type: "button", class: "primary danger", disabled: busy, onclick: () => deleteClone(voice) }, "Delete"),
        el("button", { type: "button", onclick: () => { confirmDelete = null; render(); } }, "Cancel"),
      ]);
    }
    return el("div", { class: "details" }, [
      el("span", { class: "about" }, [el("strong", null, voice.label), voice.description ? " — " + voice.description : ""]),
      voice.gender ? el("span", { class: "badge" }, voice.gender) : null,
      voice.accent ? el("span", { class: "badge" }, voice.accent) : null,
      el("button", { type: "button", class: "primary", onclick: () => useVoice(voice) }, flash[key] || "Use " + voice.label),
      voice.group === "clone"
        ? el("button", { type: "button", class: "danger", onclick: () => { confirmDelete = voice.id; render(); } }, "Delete")
        : null,
    ]);
  }

  function render() {
    root.replaceChildren(view());
  }

  function view() {
    if (error && !voices.length) return el("div", { class: "card" }, el("div", { class: "error" }, error));
    if (!voices.length) {
      return el("div", { class: "card pending", role: "status" }, [
        el("span", { class: "spinner", "aria-hidden": "true" }),
        el("strong", null, "Loading voices…"),
      ]);
    }
    const groups = [
      ["clone", "Your cloned voices"],
      ["eleven", "Eleven v3"],
      ["preset", "MiniMax presets"],
    ].filter(([g]) => voices.some((v) => v.group === g));
    const body = groups.length
      ? groups.map(([g, title]) => {
          const list = voices.filter((v) => v.group === g);
          const count = g === "clone" && library && library.maxClones != null ? " (" + list.length + "/" + library.maxClones + ")" : "";
          return el("div", { class: "group" }, [el("div", { class: "group-title" }, title + count), el("div", { class: "chips" }, list.map(chip))]);
        })
      : [el("div", { class: "chips" }, voices.map(chip))];
    return el("div", { class: "card" }, [
      notice ? el("div", { class: "notice" }, notice) : null,
      ...body,
      details(),
    ]);
  }

  /* ------------------------------- start ------------------------------ */

  render();
  request("ui/initialize", {
    appInfo: { name: "unsora-voice-picker", version: "2.0.0" },
    appCapabilities: {},
    protocolVersion: "2026-01-26",
  }).then((res) => {
    applyHostContext(res && res.hostContext);
    notify("ui/notifications/initialized", {});
    setTimeout(fetchVoices, FALLBACK_FETCH_MS);
  }).catch(() => {
    notify("ui/notifications/initialized", {});
    setTimeout(fetchVoices, FALLBACK_FETCH_MS);
  });
})();
</script>
</body>
</html>
