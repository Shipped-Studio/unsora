<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Unsora Preview</title>
<!--
  Unsora media preview (MCP Apps, `text/html;profile=mcp-app`).
  One file for image, video and audio: the server fills in KIND below.

  Flow: the host sends the create tool's result -> we read generationIds ->
  poll the app-only <kind>_status tool (at once, after 20s, then every 30s) ->
  show the media with Download / Copy URL / Animate (image) / Post / Recreate.

  No framework or SDK: a small JSON-RPC bridge over postMessage covers the
  spec methods used here (ui/initialize, tools/call, ui/message,
  ui/open-link, ui/download-file, ui/notifications/size-changed).
-->
<style>
  :root {
    color-scheme: light dark;
    --bg: var(--color-background-primary, #ffffff);
    --card: var(--color-background-secondary, #f7f7f7);
    --media-bg: var(--color-background-tertiary, #eeeeee);
    --text: var(--color-text-primary, #111111);
    --muted: var(--color-text-secondary, #6b6b6b);
    --border: var(--color-border-primary, rgba(0, 0, 0, 0.1));
    --danger: var(--color-text-danger, #c0392b);
    --primary: var(--color-text-primary, #111111);
    --on-primary: var(--color-background-primary, #ffffff);
    --radius: var(--border-radius-lg, 14px);
    --radius-sm: var(--border-radius-md, 9px);
    --font: var(--font-sans, ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif);
    --tile-aspect: 1;
  }
  :root[data-theme="dark"] {
    --bg: var(--color-background-primary, #1a1a1a);
    --card: var(--color-background-secondary, #222222);
    --media-bg: var(--color-background-tertiary, #2c2c2c);
    --text: var(--color-text-primary, #f2f2f2);
    --muted: var(--color-text-secondary, #a0a0a0);
    --border: var(--color-border-primary, rgba(255, 255, 255, 0.12));
    --danger: var(--color-text-danger, #ff7a6b);
    --primary: var(--color-text-primary, #f2f2f2);
    --on-primary: var(--color-background-primary, #1a1a1a);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; overflow: hidden; background: transparent; }
  body { font: 14px/1.4 var(--font); color: var(--text); }
  #root { padding: 2px; }

  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 12px;
  }
  .pending { display: flex; align-items: center; gap: 10px; padding: 12px 14px; }
  .spinner {
    width: 16px; height: 16px; flex: none;
    border: 2px solid var(--border); border-top-color: var(--text);
    border-radius: 50%; animation: spin 0.9s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  @media (prefers-reduced-motion: reduce) { .spinner { animation-duration: 3s; } }
  .pending strong { font-weight: 600; }
  .muted { color: var(--muted); font-size: 13px; }
  .error { color: var(--danger); font-size: 13px; }

  .grid { display: grid; gap: 10px; }
  .grid.multi { grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); }
  .media {
    display: flex; align-items: center; justify-content: center;
    background: var(--media-bg); border-radius: var(--radius-sm); overflow: hidden;
  }
  .media img, .media video { display: block; max-width: 100%; max-height: 420px; object-fit: contain; }
  /* Batch tiles take the job's aspect ratio (16:9 thumbnails, 9:16 portraits),
     square when the create tool didn't say. */
  .grid.multi .media { aspect-ratio: var(--tile-aspect); min-height: 0; }
  .grid.multi .media img, .grid.multi .media video { width: 100%; height: 100%; max-height: none; object-fit: cover; }
  .grid.multi .media.audio { aspect-ratio: auto; }
  .media audio { width: 100%; }
  .media.audio { background: none; }
  .tile-state { min-height: 90px; padding: 12px; text-align: center; }
  .text-title { font-weight: 600; margin-bottom: 6px; }
  .lyrics { white-space: pre-wrap; font-size: 13px; line-height: 1.5; }
  /* Long lyrics scroll inside their box, so the card never outgrows the
     host's widget height (the host clips anything taller). */
  .lyrics { max-height: 320px; overflow-y: auto; overscroll-behavior: contain; padding-right: 4px; }

  .actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
  .grid.multi .actions { margin-top: 6px; gap: 6px; flex-wrap: nowrap; }
  button {
    font: inherit; font-size: 13px; font-weight: 600; cursor: pointer;
    padding: 7px 14px; border-radius: var(--radius-sm);
    border: 1px solid var(--border); background: var(--bg); color: var(--text);
  }
  button:hover:not(:disabled) { filter: brightness(0.96); }
  button:disabled { opacity: 0.5; cursor: default; }
  button.primary { background: var(--primary); color: var(--on-primary); border-color: transparent; }
  .grid.multi button { padding: 5px 10px; font-size: 12px; }
</style>
</head>
<body>
<div id="root"></div>
<script>
(() => {
  "use strict";

  const KIND = "__UNSORA_KIND__"; // image | video | audio
  const STATUS_TOOL = KIND + "_status";
  const FIRST_CHECK_MS = 20000;
  const CHECK_EVERY_MS = 30000;
  const GIVE_UP_MS = 45 * 60 * 1000;
  const NOUN = { image: "image", video: "video", audio: "audio" }[KIND] || "file";

  /* ------------------------------ bridge ------------------------------ */

  let nextId = 1;
  const pending = new Map();
  let hostCaps = {};

  function post(msg) { window.parent.postMessage({ jsonrpc: "2.0", ...msg }, "*"); }

  function request(method, params) {
    const id = nextId++;
    post({ id, method, params });
    return new Promise((resolve, reject) => pending.set(id, { resolve, reject }));
  }

  function notify(method, params) { post({ method, params }); }

  window.addEventListener("message", (event) => {
    if (event.source !== window.parent) return;
    const msg = event.data;
    if (!msg || msg.jsonrpc !== "2.0") return;

    // Response to one of our requests.
    if (msg.id != null && !msg.method) {
      const p = pending.get(msg.id);
      if (!p) return;
      pending.delete(msg.id);
      msg.error ? p.reject(new Error(msg.error.message || "Request failed")) : p.resolve(msg.result);
      return;
    }
    // Request from the host.
    if (msg.id != null && msg.method) {
      if (msg.method === "ui/resource-teardown" || msg.method === "ping") {
        if (msg.method === "ui/resource-teardown") stopped = true;
        post({ id: msg.id, result: {} });
      } else {
        post({ id: msg.id, error: { code: -32601, message: "Method not found" } });
      }
      return;
    }
    // Notifications.
    const params = msg.params || {};
    switch (msg.method) {
      case "ui/notifications/tool-input":
        lastArgs = params.arguments || null;
        render();
        break;
      case "ui/notifications/tool-result":
        onToolResult(params);
        break;
      case "ui/notifications/tool-cancelled":
        state = { phase: "error", message: "Cancelled." };
        render();
        break;
      case "ui/notifications/host-context-changed":
        applyHostContext(params);
        break;
    }
  });

  function applyHostContext(ctx) {
    if (!ctx) return;
    const root = document.documentElement;
    if (ctx.theme) root.dataset.theme = ctx.theme;
    const vars = ctx.styles && ctx.styles.variables;
    if (vars) for (const [k, v] of Object.entries(vars)) if (v) root.style.setProperty(k, v);
  }

  // Report our height so the host sizes the frame exactly (no inner scroll).
  let lastHeight = 0;
  new ResizeObserver(() => {
    const height = Math.ceil(document.documentElement.getBoundingClientRect().height);
    if (height !== lastHeight) {
      lastHeight = height;
      notify("ui/notifications/size-changed", { height });
    }
  }).observe(document.documentElement);

  /* ------------------------------- state ------------------------------ */

  let state = { phase: "waiting" }; // waiting | running | error
  let items = []; // [{ id, status, url, error }]
  let slug = null; // generation kind the ids belong to (status tool arg)
  let mcpTool = null; // create tool to call again for Recreate
  let lastArgs = null;
  let startedAt = Date.now();
  let stopped = false;
  let generation = 0; // bumps on Recreate so old polls stop
  const flash = {}; // button key -> temporary label

  const isDone = (s) => s === "completed" || s === "failed";

  function onToolResult(result) {
    const sc = result && result.structuredContent;
    if (!result || result.isError || !sc) {
      state = { phase: "error", message: (sc && (sc.error || sc.message)) || textOf(result) || "Generation failed." };
      render();
      return;
    }
    start(sc);
  }

  function textOf(result) {
    const block = result && Array.isArray(result.content) && result.content.find((c) => c.type === "text");
    return block ? String(block.text).slice(0, 300) : "";
  }

  /** "16:9" -> "16 / 9" for the batch tiles; anything else keeps them square. */
  function applyAspect(ratio) {
    const m = typeof ratio === "string" && ratio.match(/^(\d+(?:\.\d+)?):(\d+(?:\.\d+)?)$/);
    document.documentElement.style.setProperty("--tile-aspect", m ? m[1] + " / " + m[2] : "1");
  }

  function start(sc) {
    const ids = Array.isArray(sc.generationIds) ? sc.generationIds.filter((v) => typeof v === "string") : [];
    if (typeof sc.tool === "string") slug = sc.tool;
    if (typeof sc.mcpTool === "string") mcpTool = sc.mcpTool;
    applyAspect(sc.aspectRatio);
    if (!ids.length) {
      state = { phase: "error", message: "No generation was started." };
      render();
      return;
    }
    items = ids.map((id) => ({ id, status: "queued", url: null, error: null }));
    state = { phase: "running" };
    startedAt = Date.now();
    const run = ++generation;
    render();
    // Check once right away: on a page reload the result we were handed is
    // the original "queued" one, and the job has often finished since.
    for (const item of items) check(item, run, FIRST_CHECK_MS);
  }

  function schedule(item, run, delay) {
    setTimeout(() => check(item, run), delay);
  }

  /** One status check; reschedules itself `nextMs` later while running. */
  async function check(item, run, nextMs = CHECK_EVERY_MS) {
    if (stopped || run !== generation || isDone(item.status)) return;
    try {
      const res = await request("tools/call", { name: STATUS_TOOL, arguments: { tool: slug, id: item.id } });
      if (run !== generation) return;
      const sc = (res && res.structuredContent) || {};
      if (res && res.isError) {
        Object.assign(item, { status: "failed", error: sc.error || "Status check failed." });
      } else if (typeof sc.status === "string") {
        Object.assign(item, {
          status: sc.status,
          url: sc.url || null,
          error: sc.error || null,
          title: sc.title || null,
          text: sc.text || null,
        });
      }
    } catch (err) {
      // Transient bridge/network error: keep polling.
    }
    if (!isDone(item.status)) {
      if (Date.now() - startedAt > GIVE_UP_MS) {
        Object.assign(item, { status: "failed", error: "Still running. Check your Unsora library later." });
      } else {
        schedule(item, run, nextMs);
      }
    }
    render();
  }

  /* ------------------------------ actions ----------------------------- */

  async function download(url) {
    try {
      if (hostCaps.downloadFile) {
        const res = await request("ui/download-file", {
          contents: [{ type: "resource_link", uri: url, name: fileName(url) }],
        });
        if (!res || !res.isError) return;
      }
    } catch (err) { /* fall through to opening the link */ }
    try {
      await request("ui/open-link", { url });
    } catch (err) {
      window.open(url, "_blank", "noopener");
    }
  }

  function fileName(url) {
    try { return decodeURIComponent(new URL(url).pathname.split("/").pop()) || "unsora-" + NOUN; }
    catch (err) { return "unsora-" + NOUN; }
  }

  async function copy(url, key) {
    let ok = false;
    try { await navigator.clipboard.writeText(url); ok = true; } catch (err) {
      const area = document.createElement("textarea");
      area.value = url;
      area.style.position = "fixed";
      area.style.opacity = "0";
      document.body.appendChild(area);
      area.select();
      try { ok = document.execCommand("copy"); } catch (e) { ok = false; }
      area.remove();
    }
    showFlash(key, ok ? "Copied" : "Copy failed");
  }

  /** Post a user message into the chat; the model drives the follow-up tool. */
  async function sendPrompt(text, key) {
    try {
      const res = await request("ui/message", { role: "user", content: [{ type: "text", text }] });
      showFlash(key, res && res.isError ? "Couldn't send" : "Sent");
    } catch (err) {
      showFlash(key, "Couldn't send");
    }
  }

  function animate(url, key) {
    sendPrompt("Animate this image into a short video with create_video, using it as the start frame (image): " + url, key);
  }

  function publish(url, key) {
    sendPrompt(
      "Publish this " + NOUN + " as a social post with Unsora (media URL: " + url + "). " +
        "Show my connected accounts first, then ask me for the caption and posting time before calling create_post.",
      key,
    );
  }

  async function recreate() {
    if (!mcpTool || !lastArgs) return;
    const run = ++generation;
    items = [];
    state = { phase: "waiting" };
    render();
    try {
      const res = await request("tools/call", { name: mcpTool, arguments: lastArgs });
      if (run === generation) onToolResult(res);
    } catch (err) {
      state = { phase: "error", message: err.message || "Couldn't start a new generation." };
      render();
    }
  }

  function showFlash(key, label) {
    flash[key] = label;
    render();
    setTimeout(() => { delete flash[key]; render(); }, 2000);
  }

  /* ------------------------------ render ------------------------------ */

  const root = document.getElementById("root");

  function el(tag, attrs, children) {
    const node = document.createElement(tag);
    for (const [k, v] of Object.entries(attrs || {})) {
      if (k === "onclick") node.addEventListener("click", v);
      else if (k === "class") node.className = v;
      else if (v === true) node.setAttribute(k, "");
      else if (v !== false && v != null) node.setAttribute(k, v);
    }
    for (const child of [].concat(children || [])) {
      if (child != null) node.append(child);
    }
    return node;
  }

  function button(label, onclick, opts) {
    const key = (opts && opts.key) || label;
    return el("button", {
      type: "button",
      class: opts && opts.primary ? "primary" : "",
      disabled: !!(opts && opts.disabled),
      onclick,
    }, flash[key] || label);
  }

  function pendingCard(label) {
    return el("div", { class: "card pending", role: "status" }, [
      el("span", { class: "spinner", "aria-hidden": "true" }),
      el("strong", null, label),
      el("span", { class: "muted" }, state.phase === "running" ? "checking every 30s" : ""),
    ]);
  }

  function mediaNode(item) {
    if (KIND === "image") return el("img", { src: item.url, alt: "Generated image" });
    if (KIND === "video") return el("video", { src: item.url, controls: true, playsinline: true, preload: "metadata" });
    return el("audio", { src: item.url, controls: true, preload: "metadata" });
  }

  function tile(item, multi) {
    if (item.status === "failed") {
      return el("div", { class: "media tile-state" }, el("span", { class: "error" }, item.error || "Generation failed."));
    }
    if (item.status !== "completed") {
      return el("div", { class: "media tile-state" }, el("span", { class: "muted" }, "Generating…"));
    }
    // Finished as text, not a file (song lyrics).
    if (!item.url) return item.text ? textTile(item) : el("div", { class: "muted" }, "Done.");
    const box = el("div", null, [el("div", { class: "media" + (KIND === "audio" ? " audio" : "") }, mediaNode(item))]);
    if (multi) {
      box.append(el("div", { class: "actions" }, [
        button("Save", () => download(item.url), { primary: true, key: "dl:" + item.id }),
        button("Copy", () => copy(item.url, "cp:" + item.id), { key: "cp:" + item.id }),
        KIND === "image" ? button("Animate", () => animate(item.url, "an:" + item.id), { key: "an:" + item.id }) : null,
      ]));
    }
    return box;
  }

  function textTile(item) {
    return el("div", null, [
      item.title ? el("div", { class: "text-title" }, item.title) : null,
      el("div", { class: "lyrics", tabindex: "0" }, item.text),
    ]);
  }

  function render() {
    root.replaceChildren(view());
  }

  function view() {
    if (state.phase === "error") {
      return el("div", { class: "card" }, [
        el("div", { class: "error" }, state.message),
        canRecreate() ? el("div", { class: "actions" }, button("Try again", recreate)) : null,
      ]);
    }
    if (state.phase === "waiting" || !items.length) return pendingCard("Starting…");
    if (!items.every((i) => isDone(i.status))) {
      // Show finished tiles as they land in a batch; otherwise one compact row.
      if (items.length === 1 || !items.some((i) => i.status === "completed")) {
        return pendingCard(KIND === "video" ? "Rendering…" : "Generating…");
      }
    }

    const multi = items.length > 1;
    const single = !multi && items[0];
    const card = el("div", { class: "card" }, [
      el("div", { class: "grid" + (multi ? " multi" : "") }, items.map((i) => tile(i, multi))),
    ]);

    const bar = [];
    if (single && single.status === "completed" && !single.url && single.text) {
      bar.push(button("Copy lyrics", () => copy(single.text, "Copy lyrics"), { primary: true }));
    }
    if (single && single.status === "completed" && single.url) {
      bar.push(button("Download", () => download(single.url), { primary: true }));
      bar.push(button("Copy URL", () => copy(single.url, "Copy URL")));
      if (KIND === "image") bar.push(button("Animate", () => animate(single.url, "Animate")));
      if (KIND !== "audio") bar.push(button("Post", () => publish(single.url, "Post")));
    }
    if (canRecreate() && items.every((i) => isDone(i.status))) {
      bar.push(button("Recreate", recreate));
    }
    if (bar.length) card.append(el("div", { class: "actions" }, bar));
    return card;
  }

  const canRecreate = () => !!(mcpTool && lastArgs);

  /* ------------------------------- start ------------------------------ */

  render();
  request("ui/initialize", {
    appInfo: { name: "unsora-" + KIND + "-preview", version: "2.0.0" },
    appCapabilities: {},
    protocolVersion: "2026-01-26",
  }).then((res) => {
    hostCaps = (res && res.hostCapabilities) || {};
    applyHostContext(res && res.hostContext);
    notify("ui/notifications/initialized", {});
  }).catch(() => {
    notify("ui/notifications/initialized", {});
  });
})();
</script>
</body>
</html>
